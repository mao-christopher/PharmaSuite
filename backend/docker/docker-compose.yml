version: "3.9"

services:
  yolo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pharma-yolo:latest
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../runs:/app/runs
    env_file:
      - ../.env
    # Remove the deploy block if you don't have an NVIDIA GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Jupyter for notebook-based exploration
  notebook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pharma-yolo:latest
    command: ["-m", "jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root"]
    ports:
      - "8888:8888"
    volumes:
      - ../:/app
  # MongoDB for inventory state, events, receipts, and alerts
  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
