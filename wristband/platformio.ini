; ESP32-S3 Super Mini + MPU6050
;   pio run -t upload
;   pio device monitor

[env:esp32-s3-super-mini]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino

upload_port = COM6
monitor_port = COM6
upload_speed = 921600
monitor_speed = 115200

; Chip is 4 MB flash. The DevKitC-1 def defaults to 8 MB.
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default.csv

; Native USB-Serial/JTAG. Serial goes to the USB port, not the UART pins.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -DEI_PORTING_ARDUINO=1
    -DEI_PORTING_ESPRESSIF=0
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
    -DEI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=0
    -DEIDSP_USE_CMSIS_DSP=0
    -DEIDSP_USE_ESP_DSP=0
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
